<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Teacher's Companion | Handbook for Future English Teachers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fff9f5 0%, #ffe9e6 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #5a3e3a;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Hero section */
        .hero {
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 25px 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
            border: 1px solid #ffdbd4;
        }

        .hero-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        .teacher-img {
            width: 120px;
            height: 120px;
            border-radius: 100%;
            object-fit: cover;
            background: #ffe0da;
            padding: 5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .hero-text h1 {
            font-size: 2rem;
            color: #c26b5e;
            margin-bottom: 8px;
        }

        .hero-text p {
            font-size: 1rem;
            max-width: 500px;
            color: #8b6b64;
        }

        /* Daily Affirmation */
        .affirmation {
            background: #fff0ec;
            border-radius: 60px;
            padding: 18px 25px;
            margin-bottom: 35px;
            text-align: center;
            border: 1px solid #ffdbd4;
        }

        .affirmation h3 {
            color: #c26b5e;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .affirmation p {
            font-size: 1.2rem;
            font-style: italic;
            color: #8b5a52;
            font-weight: 500;
        }

        /* Menu grid */
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 48px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #ffe0da;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
            background: white;
        }

        .card-header {
            background: #fff0ec;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #c26b5e;
        }

        .card-header img {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 50%;
        }

        .toggle-icon {
            font-size: 1.8rem;
            color: #e8a99c;
        }

        /* Detail view */
        .detail-view {
            background: #fffefa;
            border-radius: 48px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            border: 1px solid #ffdbd4;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ffe0da;
        }

        .detail-header h2 {
            font-size: 1.8rem;
            color: #c26b5e;
        }

        .back-btn {
            background: #ffe0da;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: #c26b5e;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #ffd5cc;
        }

        .detail-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a403c;
        }

        .detail-content img {
            max-width: 100%;
            border-radius: 32px;
            margin: 20px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .detail-content h4 {
            color: #b95c4e;
            margin: 25px 0 10px 0;
            font-size: 1.2rem;
        }

        .detail-content ul, .detail-content ol {
            padding-left: 25px;
            margin: 12px 0;
        }

        .detail-content li {
            margin: 8px 0;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .badge {
            background: #ffe0da;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #b95c4e;
            font-weight: 500;
        }

        .tip-box {
            background: #fff0ec;
            border-left: 4px solid #c26b5e;
            padding: 15px;
            margin: 20px 0;
            border-radius: 20px;
        }

        .games-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .game-link {
            background: #f2e1dc;
            padding: 8px 18px;
            border-radius: 60px;
            text-decoration: none;
            color: #b85c4a;
            font-weight: 500;
            transition: 0.2s;
            display: inline-block;
        }

        .game-link:hover {
            background: #e8cbc3;
            transform: scale(1.02);
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: #ffffffaa;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #b07a6e;
        }

        @media (max-width: 700px) {
            .teacher-img { width: 80px; height: 80px; }
            .hero-text h1 { font-size: 1.4rem; }
            .detail-header h2 { font-size: 1.4rem; }
            .section-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="hero-content">
            <img class="teacher-img" src="https://i.pinimg.com/736x/c0/b0/45/c0b0455cca292178710730f99e727fe8.jpg" alt="Teacher">
            <div class="hero-text">
                <h1>Teacher's Companion</h1>
                <p>Handbook for future English teachers — confidence, empathy, and ready-to-use tools.</p>
            </div>
        </div>
    </div>

    <div class="affirmation" id="affirmationBox">
        <h3>✨ DAILY AFFIRMATION ✨</h3>
        <p id="affirmationText">Loading...</p>
    </div>

    <div id="menuGrid" class="section-grid"></div>

    <div id="detailView" class="detail-view hidden">
        <div class="detail-header">
            <button class="back-btn" id="backToMenuBtn">← Back to menu</button>
            <h2 id="detailTitle"></h2>
        </div>
        <div id="detailContent" class="detail-content"></div>
    </div>

    <footer>
        You've got this, future teacher. <br>
        Every expert was once a beginner. Keep learning, keep growing.
    </footer>
</div>

<script>
    const sectionsData = [
        {
            id: "realTeacher",
            title: "Who is a real teacher?",
            cardImage: "https://cdn.vectorstock.com/i/500p/16/58/blonde-superhero-kid-with-red-cape-vector-51921658.jpg",
            detailImage: "https://cdn.vectorstock.com/i/500p/16/58/blonde-superhero-kid-with-red-cape-vector-51921658.jpg",
            content: `
                <img src="https://cdn.vectorstock.com/i/500p/16/58/blonde-superhero-kid-with-red-cape-vector-51921658.jpg" alt="Superhero teacher">
                <p>A real teacher is not just someone who explains grammar rules. A real teacher is a mentor, a guide, and sometimes a friend.</p>
                <h4>10 qualities of a truly great teacher</h4>
                <ul>
                    <li><strong>Patient</strong> — You explain the same rule 10 times without sighing. Students learn at different speeds.</li>
                    <li><strong>Flexible</strong> — You can change your lesson plan in 2 minutes when technology fails.</li>
                    <li><strong>Empathetic</strong> — You remember how it felt to be a student. You notice when someone is struggling.</li>
                    <li><strong>Passionate</strong> — Your energy for English is contagious. If you love it, they will too.</li>
                    <li><strong>Respectful</strong> — You treat every student as a human being, not a grade.</li>
                    <li><strong>Humorous</strong> — You can laugh at your own mistakes. It makes you approachable.</li>
                    <li><strong>Consistent</strong> — You do what you say you will do. Rules are the same for everyone.</li>
                    <li><strong>A lifelong learner</strong> — You are still learning English and teaching methods yourself.</li>
                    <li><strong>Observant</strong> — You notice the quiet student, the tired face, the small win.</li>
                    <li><strong>Courageous</strong> — You admit when you're wrong. You try new things even if they might fail.</li>
                </ul>
                <div class="tip-box">💡 <strong>Remember:</strong> "A good teacher is not one who gives all the answers, but one who makes students want to find them themselves."</div>
            `
        },
        {
            id: "expressions",
            title: "Classroom expressions",
            cardImage: "https://i.ytimg.com/vi/5Sc0a0lp0_8/maxresdefault.jpg",
            detailImage: "https://i.ytimg.com/vi/5Sc0a0lp0_8/maxresdefault.jpg",
            content: `
                <img src="https://i.ytimg.com/vi/5Sc0a0lp0_8/maxresdefault.jpg" alt="Classroom expressions">
                <p>Using the right phrases at the right time makes your classroom run smoothly. Here is a complete list of useful expressions.</p>
                <h4>Starting the lesson</h4><ul><li>"Good morning/afternoon, everyone!"</li><li>"Let's begin, please."</li><li>"Take your seats."</li><li>"Who is absent today?"</li></ul>
                <h4>Giving instructions</h4><ul><li>"Open your books to page ___."</li><li>"Work in pairs / groups of three."</li><li>"Listen carefully."</li><li>"Raise your hand if you know the answer."</li></ul>
                <h4>Checking understanding</h4><ul><li>"Does anyone have any questions?"</li><li>"Is everything clear?"</li><li>"Can you repeat that in your own words?"</li><li>"Give me a thumbs up if you understand."</li></ul>
                <h4>Managing the classroom</h4><ul><li>"Eyes on me, please."</li><li>"One at a time."</li><li>"Put your phones away."</li></ul>
                <h4>Encouraging students</h4><ul><li>"Good job!"</li><li>"Excellent answer!"</li><li>"Don't worry, try again."</li><li>"You're making great progress."</li></ul>
                <h4>Ending the lesson</h4><ul><li>"Let's quickly review what we learned today."</li><li>"Your homework is ___."</li><li>"See you next time!"</li></ul>
                <div class="tip-box">💡 <strong>Pro tip:</strong> Write 5-10 key expressions on the classroom wall.</div>
            `
        },
        {
            id: "bullying",
            title: "Stop bullying in your class",
            cardImage: "https://i.ytimg.com/vi/ctlcuG-m0xk/maxres2.jpg",
            detailImage: "https://i.ytimg.com/vi/ctlcuG-m0xk/maxres2.jpg",
            content: `
                <img src="https://i.ytimg.com/vi/ctlcuG-m0xk/maxres2.jpg" alt="Stop bullying">
                <p>Bullying destroys learning. As a teacher, you are responsible for creating a safe environment.</p>
                <h4>Step 1: Prevent it before it starts</h4><ul><li>Set clear rules: "We respect everyone."</li><li>Build a positive culture: celebrate kindness.</li><li>Model respect — never mock a student.</li></ul>
                <h4>Step 2: Recognize the signs</h4><ul><li>Sudden quietness, anxiety, avoiding classmates</li><li>Hurtful "jokes" repeated</li><li>Unexplained absences or drop in grades</li></ul>
                <h4>Step 3: Intervene calmly</h4><ul><li>Privately: "I noticed what you said. That wasn't kind."</li><li>Never humiliate a student in front of others.</li></ul>
                <h4>Step 4: Support the victim</h4><ul><li>Talk privately: "What would help you feel safer?"</li><li>Create a safety plan (sit near me, use a signal).</li></ul>
                <div class="tip-box">⚠️ <strong>Never ignore bullying.</strong> Silence is agreement.</div>
            `
        },
        {
            id: "emotions",
            title: "When emotions overwhelm you",
            cardImage: "https://i.ytimg.com/vi/_YmvnAFW9Qw/maxresdefault.jpg",
            detailImage: "https://i.ytimg.com/vi/_YmvnAFW9Qw/maxresdefault.jpg",
            content: `
                <img src="https://i.ytimg.com/vi/_YmvnAFW9Qw/maxresdefault.jpg" alt="Emotional balance">
                <p>Teaching is emotionally intense. You will feel anxious, insecure, or exhausted sometimes. Here's how to cope.</p>
                <h4>Before the lesson: fighting anxiety</h4><ul><li>"I'm not ready" → Nobody is 100% ready.</li><li>"They won't listen" → Start with a strong voice.</li><li>"I'll make a mistake" → Say "Oops, let me correct that" — honesty builds trust.</li></ul>
                <h4>During the lesson: if panic hits</h4><ol><li>Breathe — 4 sec in, 4 hold, 4 out.</li><li>Take a pause — drink water, write on the board.</li><li>Use a prepared phrase: "Give me one moment, please."</li></ol>
                <h4>Speaking confidently in front of a large audience</h4><ul><li>Practice out loud (first 2 minutes of lesson 5 times).</li><li>Look at foreheads, not eyes.</li><li>Hold something (pen, remote) to calm hands.</li><li>Move around — walking reduces nervous energy.</li></ul>
                <div class="tip-box">💪 <strong>Confidence is not "I'm perfect." Confidence is "I can handle whatever happens."</strong></div>
            `
        },
        {
            id: "gamesNoprep",
            title: "Extra time? No‑prep games",
            cardImage: "https://i.ytimg.com/vi/weEF_vW0eto/maxresdefault.jpg",
            detailImage: "https://i.ytimg.com/vi/weEF_vW0eto/maxresdefault.jpg",
            content: `
                <img src="https://i.ytimg.com/vi/weEF_vW0eto/maxresdefault.jpg" alt="No-prep games">
                <p>You finished 10 minutes early. Don't panic. Here are games that need ZERO preparation.</p>
                <div class="badge-list"><span class="badge">20 Questions</span><span class="badge">Last Letter</span><span class="badge">Word Chain Story</span><span class="badge">Alphabet Game</span><span class="badge">Draw & Guess</span><span class="badge">Two Truths, One Lie</span><span class="badge">Stop the Bus</span></div>
                <ul><li><strong>20 Questions:</strong> Teacher thinks of a word. Students ask yes/no questions.</li><li><strong>Last Letter:</strong> Say a word, next student says a word starting with last letter (apple → elephant).</li><li><strong>Stop the Bus:</strong> Grid with categories (Name, Food, Animal, Country). Pick a letter, first to fill all shouts "Stop the bus!"</li><li><strong>Two Truths, One Lie:</strong> Student says 3 statements, others guess the lie.</li></ul>
                <h4>Low‑prep games (1-2 minutes to set up)</h4><ul><li><strong>Hot Seat:</strong> One student describes a word without saying it.</li><li><strong>Role Play:</strong> Give a scenario ("At a hotel — room is dirty").</li><li><strong>Running Dictation:</strong> Stick text on wall, students run, memorize, write.</li></ul>
                <div class="tip-box">💡 <strong>Pro tip:</strong> Keep a printed list of these games in your bag.</div>
            `
        },
        {
            id: "gameWebsites",
            title: "Websites to create games",
            cardImage: "https://www.meme-arsenal.com/memes/bcdd88732dc415554cc14308a84d947c.jpg",
            detailImage: "https://www.meme-arsenal.com/memes/bcdd88732dc415554cc14308a84d947c.jpg",
            content: `
                <img src="https://www.meme-arsenal.com/memes/bcdd88732dc415554cc14308a84d947c.jpg" alt="Game websites">
                <p>These free tools let you create crosswords, word searches, bingo, and interactive quizzes in minutes.</p>
                <div class="games-links">
                    <a href="https://crosswordlabs.com/" target="_blank" class="game-link">Crossword Labs</a>
                    <a href="https://worksheets.theteacherscorner.net/make-your-own/word-search/" target="_blank" class="game-link">Word Search Maker</a>
                    <a href="https://www.educaplay.com/" target="_blank" class="game-link">Educaplay</a>
                    <a href="https://www.baamboozle.com/" target="_blank" class="game-link">Baamboozle</a>
                    <a href="https://wordwall.net/" target="_blank" class="game-link">Wordwall</a>
                    <a href="https://www.flippity.net/" target="_blank" class="game-link">Flippity</a>
                    <a href="https://quizlet.com/" target="_blank" class="game-link">Quizlet</a>
                </div>
                <div class="tip-box">💡 <strong>Recommendation:</strong> Start with Wordwall (easiest) and Baamboozle (most fun).</div>
            `
        },
        {
            id: "emergencyKit",
            title: "Your emergency kit",
            cardImage: "https://i.imgflip.com/6k3w60.jpg",
            detailImage: "https://i.imgflip.com/6k3w60.jpg",
            content: `
                <img src="https://i.imgflip.com/6k3w60.jpg" alt="Emergency kit">
                <img src="https://ir.ozone.ru/s3/multimedia-a/6086601466.jpg" alt="Emergency kit box" style="margin-top: 10px;">
                <p>Be prepared. Keep these items in your bag or on your desk at all times.</p>
                <h4>Physical items</h4><ul><li>Water bottle — to take a pause</li><li>List of 5 no‑prep games — printed</li><li>Small notebook — to reflect after lessons</li><li>One printed short story — for unexpected silence</li><li>Small stress ball</li><li>Spare pens and paper</li></ul>
                <div class="tip-box">🌟 <strong>Last words:</strong> You will have bad lessons. That is normal. Every experienced teacher started where you are now — scared, excited, and unsure. Caring is the most important quality. You've got this.</div>
            `
        }
    ];

    // Daily affirmations
    const affirmations = [
        "You are capable of more than you know.",
        "Today, you will make a difference in someone's life.",
        "Mistakes are proof that you are trying. Keep going!",
        "Your students are lucky to have you.",
        "One small positive thought can change your whole day.",
        "You don't have to be perfect. You just have to be present.",
        "Every expert was once a beginner.",
        "Your energy matters. Show up as YOU.",
        "Some days you'll inspire them; other days they'll inspire you.",
        "Breathe. You've got this."
    ];

    function setDailyAffirmation() {
        const today = new Date().toDateString();
        const stored = localStorage.getItem("teacherAffirmationDate");
        let affirmation;
        if (stored === today) {
            affirmation = localStorage.getItem("teacherAffirmationText");
        } else {
            const randomIndex = Math.floor(Math.random() * affirmations.length);
            affirmation = affirmations[randomIndex];
            localStorage.setItem("teacherAffirmationDate", today);
            localStorage.setItem("teacherAffirmationText", affirmation);
        }
        document.getElementById("affirmationText").innerText = affirmation;
    }

    function renderMenu() {
        const menuGrid = document.getElementById("menuGrid");
        menuGrid.innerHTML = "";
        sectionsData.forEach((section) => {
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = () => openDetail(section.id);
            
            card.innerHTML = `
                <div class="card-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <img src="${section.cardImage}" alt="icon" onerror="this.src='https://via.placeholder.com/44?text=📚'">
                        <span>${section.title}</span>
                    </div>
                    <span class="toggle-icon">❤️</span>
                </div>
            `;
            menuGrid.appendChild(card);
        });
    }

    function openDetail(id) {
        const section = sectionsData.find(s => s.id === id);
        if (!section) return;
        
        document.getElementById("detailTitle").innerHTML = section.title;
        document.getElementById("detailContent").innerHTML = section.content;
        
        document.getElementById("menuGrid").classList.add("hidden");
        document.getElementById("detailView").classList.remove("hidden");
        
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToMenu() {
        document.getElementById("menuGrid").classList.remove("hidden");
        document.getElementById("detailView").classList.add("hidden");
    }

    document.getElementById("backToMenuBtn").addEventListener("click", backToMenu);

    renderMenu();
    setDailyAffirmation();
</script>
</body>
</html>
