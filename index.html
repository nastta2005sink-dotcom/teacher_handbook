<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Teacher's Companion | Handbook for Future English Teachers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fff9f5 0%, #ffe9e6 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #5a3e3a;
            padding: 30px 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Header with teacher image */
        .hero {
            background: #ffffffcc;
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.05);
            border: 1px solid #ffdbd4;
        }

        .hero-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .teacher-img {
            font-size: 120px;
            background: #ffe0da;
            border-radius: 100%;
            padding: 20px;
            display: inline-block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .hero-text h1 {
            font-size: 2.2rem;
            color: #c26b5e;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 1.1rem;
            max-width: 500px;
            color: #8b6b64;
        }

        /* Section grid */
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        /* Cards */
        .card {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border-radius: 48px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid #ffe0da;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.08);
            background: white;
        }

        .card-header {
            background: #fff0ec;
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.3rem;
            color: #c26b5e;
            transition: 0.2s;
        }

        .card-header:hover {
            background: #ffe4dd;
        }

        .card-header .emoji {
            font-size: 1.8rem;
        }

        .toggle-icon {
            font-size: 1.5rem;
            transition: 0.2s;
        }

        .card-content {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.3s;
            background: #fffffffa;
            border-top: 1px solid #ffe0da;
        }

        .card-content.show {
            max-height: 3000px;
            padding: 25px;
        }

        /* inner content style */
        .card-content h4 {
            color: #b95c4e;
            margin: 20px 0 8px 0;
            font-size: 1.1rem;
        }

        .card-content p, .card-content li {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #5a403c;
        }

        .card-content ul, .card-content ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .card-content li {
            margin: 8px 0;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .badge {
            background: #ffe0da;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #b95c4e;
            font-weight: 500;
        }

        .tip-box {
            background: #fff0ec;
            border-left: 4px solid #c26b5e;
            padding: 15px;
            margin: 15px 0;
            border-radius: 20px;
        }

        .table-wrap {
            overflow-x: auto;
            margin: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff9f5;
            border-radius: 20px;
            overflow: hidden;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #ffe0da;
        }

        th {
            background: #ffe0da;
            color: #b95c4e;
        }

        hr {
            margin: 15px 0;
            border: none;
            height: 1px;
            background: #ffe0da;
        }

        .games-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }

        .game-link {
            background: #f2e1dc;
            padding: 8px 18px;
            border-radius: 60px;
            text-decoration: none;
            color: #b85c4a;
            font-weight: 500;
            transition: 0.2s;
            display: inline-block;
        }

        .game-link:hover {
            background: #e8cbc3;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            background: #ffffffaa;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #b07a6e;
        }

        @media (max-width: 700px) {
            .hero-text h1 { font-size: 1.6rem; }
            .teacher-img { font-size: 80px; }
            .section-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

</div>

            content: `
                <p>Bullying destroys learning. As a teacher, you are responsible for creating a safe environment. Here's a step‑by‑step guide.</p>

                <h4>✅ Step 1: Prevent it before it starts</h4>
                <ul>
                    <li><strong>Set clear rules from day one:</strong> "In this class, we respect everyone. No exceptions."</li>
                    <li><strong>Build a positive classroom culture:</strong> Do team‑building activities. Celebrate acts of kindness publicly.</li>
                    <li><strong>Model respect:</strong> Never mock a student's answer, accent, or background.</li>
                    <li><strong>Teach emotional vocabulary:</strong> Help students name their feelings ("frustrated", "excluded", "hurt").</li>

                <h4>🚨 Step 2: Recognize the signs of bullying</h4>
                <ul>
                    <li>A student suddenly becomes quiet, anxious, or avoids certain classmates</li>
                    <li>A student makes hurtful "jokes" repeatedly — especially about appearance, accent, or family</li>

                    <li>Unexplained absences or drop in grades</li>

                <h4>⚡ Step 3: Intervene immediately (but calmly)</h4>

    // Build the grid with accordion behaviour (only one open at a time)

        sectionsData.forEach((section, idx) => {
            const card = document.createElement("div");
            card.className = "card";

            const header = document.createElement("div");
            header.className = "card-header";
            header.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span class="emoji">${section.emoji}</span>
                    <span>${section.title}</span>
                </div>
                <span class="toggle-icon">▼</span>
            `;

            const contentDiv = document.createElement("div");
            contentDiv.className = "card-content";
            contentDiv.innerHTML = section.content;

            header.addEventListener("click", () => {
                const isCurrentlyOpen = contentDiv.classList.contains("show");
                
                // Close ALL open sections
                document.querySelectorAll(".card-content").forEach(cont => {
                    cont.classList.remove("show");
                    const prevHeader = cont.previousElementSibling;
                    if (prevHeader) prevHeader.querySelector(".toggle-icon").textContent = "▼";
                });
                
                // If it wasn't open before, open this one
                if (!isCurrentlyOpen) {
                    contentDiv.classList.add("show");
                    const icon = header.querySelector(".toggle-icon");
                    icon.textContent = "▲";
                }
            });

            card.appendChild(header);
            card.appendChild(contentDiv);
            gridContainer.appendChild(card);
        });
    }

    buildAccordion();
</script>
</body>
</html>
